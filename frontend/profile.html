<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - AI Inventory Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i class="bi bi-box-seam-fill"></i></div>
            <div>
                <h2>AI Inventory</h2>
                <p>Management System</p>
            </div>
        </div>
        <ul class="sidebar-nav">
            <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li><a href="products.html"><i class="bi bi-box"></i> Products</a></li>
            <li><a href="inventory.html"><i class="bi bi-arrow-left-right"></i> Inventory</a></li>
            <li><a href="suppliers.html"><i class="bi bi-truck"></i> Suppliers</a></li>
            <li><a href="sales.html"><i class="bi bi-cart-check"></i> Sales</a></li>
            <li><a href="purchases.html"><i class="bi bi-bag"></i> Purchases</a></li>
            <li><a href="ai-agent.html"><i class="bi bi-robot"></i> AI Agent</a></li>
            <li><a href="reports.html"><i class="bi bi-graph-up"></i> Reports</a></li>
            <li class="active"><a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a></li>
            <li class="logout-item"><a href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="top-bar d-flex justify-content-between align-items-center mb-4">
            <button class="btn d-md-none" onclick="toggleSidebar()"><i class="bi bi-list fs-4"></i></button>
            <h4 class="mb-0">Profile</h4>
            <div class="d-flex align-items-center gap-2">
                <span id="userDisplay"></span>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="card-header">
                    <h3><i class="bi bi-person" style="margin-right: 8px;"></i> Profile Information</h3>
                </div>
                <div id="profileInfo">
                    <div class="loading-overlay"><div class="spinner"></div> Loading profile...</div>
                </div>
            </div>

            <div>
                <div class="card">
                    <div class="card-header">
                        <h3><i class="bi bi-pencil-square" style="margin-right: 8px;"></i> Edit Profile</h3>
                    </div>
                    <form id="editProfileForm" onsubmit="updateProfile(event)">
                        <div class="form-group">
                            <label for="editFullName">Full Name</label>
                            <input type="text" id="editFullName" class="form-control" placeholder="Your full name">
                        </div>
                        <div class="form-group">
                            <label for="editEmail">Email</label>
                            <input type="email" id="editEmail" class="form-control" placeholder="Your email">
                        </div>
                        <div class="form-group">
                            <label for="editUsername">Username</label>
                            <input type="text" id="editUsername" class="form-control" placeholder="Your username" readonly style="background: #f1f5f9; cursor: not-allowed;">
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Save Changes
                        </button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3><i class="bi bi-lock" style="margin-right: 8px;"></i> Change Password</h3>
                    </div>
                    <form id="changePasswordForm" onsubmit="changePassword(event)">
                        <div class="form-group">
                            <label for="currentPassword">Current Password</label>
                            <input type="password" id="currentPassword" class="form-control" placeholder="Enter current password" required>
                        </div>
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <input type="password" id="newPassword" class="form-control" placeholder="Enter new password (min 6 chars)" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label for="confirmNewPassword">Confirm New Password</label>
                            <input type="password" id="confirmNewPassword" class="form-control" placeholder="Confirm new password" required>
                        </div>
                        <button type="submit" class="btn btn-warning">
                            <i class="bi bi-key"></i> Change Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
