<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - AI Inventory Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"><i class="bi bi-box-seam-fill"></i></div>
            <div>
                <h2>AI Inventory</h2>
                <p>Management System</p>
            </div>
        </div>
        <ul class="sidebar-nav">
            <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
            <li class="active"><a href="products.html"><i class="bi bi-box"></i> Products</a></li>
            <li><a href="inventory.html"><i class="bi bi-arrow-left-right"></i> Inventory</a></li>
            <li><a href="suppliers.html"><i class="bi bi-truck"></i> Suppliers</a></li>
            <li><a href="sales.html"><i class="bi bi-cart-check"></i> Sales</a></li>
            <li><a href="purchases.html"><i class="bi bi-bag"></i> Purchases</a></li>
            <li><a href="ai-agent.html"><i class="bi bi-robot"></i> AI Agent</a></li>
            <li><a href="reports.html"><i class="bi bi-graph-up"></i> Reports</a></li>
            <li><a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a></li>
            <li class="logout-item"><a href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="top-bar d-flex justify-content-between align-items-center mb-4">
            <button class="btn d-md-none" onclick="toggleSidebar()"><i class="bi bi-list fs-4"></i></button>
            <h4 class="mb-0">Products</h4>
            <div class="d-flex align-items-center gap-2">
                <span id="userDisplay"></span>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div class="d-flex gap-2 flex-wrap align-items-center">
                <div class="search-bar mb-0 flex-grow-1">
                    <div class="search-input">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="Search products..." oninput="searchProducts()">
                    </div>
                </div>
                <button class="btn btn-outline" onclick="toggleFilter('productsFilterPanel')"><i class="bi bi-funnel"></i> Filters</button>
            </div>
            <button class="btn btn-primary" onclick="resetProductForm(); openModal('addProductModal')">
                <i class="bi bi-plus-lg"></i> Add Product
            </button>
        </div>

        <div class="filter-panel" id="productsFilterPanel">
            <div class="filter-row">
                <div class="filter-group">
                    <label>Category</label>
                    <select class="form-control" id="productCategoryFilter">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Status</label>
                    <select class="form-control" id="productStatusFilter">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Sort By</label>
                    <select class="form-control" id="productSortFilter">
                        <option value="">Default</option>
                        <option value="name">Name</option>
                        <option value="price-asc">Price Low-High</option>
                        <option value="price-desc">Price High-Low</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" onclick="applyProductFilters()"><i class="bi bi-funnel"></i> Apply</button>
                    <button class="btn btn-outline" onclick="clearProductFilters()"><i class="bi bi-x-lg"></i> Clear</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>SKU</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <tr>
                            <td colspan="7" class="empty-state">
                                <div class="loading-overlay"><div class="spinner"></div> Loading products...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addProductModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="productModalTitle">Add New Product</h3>
                <button class="close-btn" onclick="closeModal('addProductModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="productForm" onsubmit="saveProduct(event)">
                    <input type="hidden" id="editProductId" value="">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productName">Product Name *</label>
                            <input type="text" id="productName" class="form-control" placeholder="Product name" required>
                        </div>
                        <div class="form-group">
                            <label for="productSku">SKU *</label>
                            <input type="text" id="productSku" class="form-control" placeholder="e.g., PRD-001" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" class="form-control" placeholder="Product description"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productCategory">Category *</label>
                            <input type="text" id="productCategory" class="form-control" placeholder="e.g., Electronics" required>
                        </div>
                        <div class="form-group">
                            <label for="productReorderLevel">Reorder Level *</label>
                            <input type="number" id="productReorderLevel" class="form-control" placeholder="10" min="0" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="productUnitPrice">Unit Price ($) *</label>
                            <input type="number" id="productUnitPrice" class="form-control" placeholder="0.00" step="0.01" min="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="productCostPrice">Cost Price ($) *</label>
                            <input type="number" id="productCostPrice" class="form-control" placeholder="0.00" step="0.01" min="0.01" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('addProductModal')">Cancel</button>
                <button class="btn btn-primary" onclick="document.getElementById('productForm').requestSubmit()">
                    <i class="bi bi-check-lg"></i> Save Product
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
