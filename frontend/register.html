<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - AI Inventory Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid login-bg auth-wrapper">
        <div class="row justify-content-center align-items-center h-100">
            <div class="col-xl-4 col-lg-5 col-md-6 col-sm-10">
                <div class="card shadow-lg border-0 rounded-4 auth-card">
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="text-center mb-3 flex-shrink-0">
                            <i class="bi bi-box-seam-fill display-3 text-primary"></i>
                            <h2 class="fw-bold display-6 mb-2">AI Inventory Agent</h2>
                            <span class="badge bg-success rounded-pill px-3 py-2 mb-2">Create Account</span>
                        </div>
                        <div class="auth-form">
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="fullName" placeholder="Enter Full Name" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username" placeholder="Choose a Username" required minlength="3">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email" placeholder="Enter Email" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="password" placeholder="Min 6 characters" required minlength="6">
                                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter Password" required minlength="6">
                                </div>
                                <div id="registerError" class="alert alert-danger d-none"></div>
                                <button type="submit" class="btn btn-success w-100 d-flex justify-content-center align-items-center gap-2">
                                    Register
                                </button>
                            </form>
                        </div>
                        <div class="text-center mt-3 flex-shrink-0">
                            Already have an account? <a href="login.html">Sign In</a>
                            <hr class="my-2">
                            <small class="text-muted">
                                AI Inventory Agent v1.0<br>
                                &copy; 2026 All Rights Reserved
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
